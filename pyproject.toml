[project]
name = "application-identity-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
application-identity-risk = "application_identity_risk:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
